# Module 2: the agentgateway proxy. One Gateway serves LLM (Module 2), MCP (Module 3) and A2A traffic.
# The agentgateway controller sees this Gateway (gatewayClassName: agentgateway) and creates the
# agentgateway-proxy Deployment + Service for it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All          # routes in any namespace may attach
