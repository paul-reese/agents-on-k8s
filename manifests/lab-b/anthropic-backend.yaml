# Module 2: Anthropic as an agentgateway backend, plus the route that sends Anthropic Messages traffic to it.
# The real API key lives only here (Secret anthropic-secret in agentgateway-system), created by
# scripts/02-install-agentgateway.sh. agentgateway sends it to Anthropic in the x-api-key header.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  ai:
    provider:
      anthropic:
        model: claude-haiku-4-5      # optional override; unset = use the model the client asks for
  policies:
    auth:
      secretRef:
        name: anthropic-secret
---
# Anthropic SDK clients call <baseUrl>/v1/messages. This route catches that path (and
# /v1/messages/count_tokens) and leaves /mcp free for Module 3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anthropic
  namespace: agentgateway-system
spec:
  parentRefs:
  - name: agentgateway-proxy
    namespace: agentgateway-system
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/messages
    backendRefs:
    - name: anthropic
      namespace: agentgateway-system
      group: agentgateway.dev
      kind: AgentgatewayBackend
