# Module 3: two ordinary MCP servers, running as normal Deployments (not inside Substrate).
#  - website-fetcher: one tool, `fetch`, that downloads a web page (speaks SSE)
#  - everything: the MCP reference server with many demo tools (speaks Streamable HTTP)
# appProtocol: agentgateway.dev/mcp tells agentgateway these Services speak MCP.
apiVersion: v1
kind: Namespace
metadata:
  name: mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-fetcher
  namespace: mcp
spec:
  selector:
    matchLabels: { app: website-fetcher }
  template:
    metadata:
      labels: { app: website-fetcher }
    spec:
      containers:
      - name: server
        image: ghcr.io/peterj/mcp-website-fetcher:main
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: website-fetcher
  namespace: mcp
  labels: { app: website-fetcher }
spec:
  selector: { app: website-fetcher }
  ports:
  - port: 80
    targetPort: 8000
    appProtocol: agentgateway.dev/mcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: everything
  namespace: mcp
spec:
  selector:
    matchLabels: { app: everything }
  template:
    metadata:
      labels: { app: everything }
    spec:
      containers:
      - name: server
        image: node:20-alpine
        command: ["npx"]
        args: ["-y", "@modelcontextprotocol/server-everything", "streamableHttp"]
        ports:
        - containerPort: 3001
        readinessProbe:
          tcpSocket: { port: 3001 }
          initialDelaySeconds: 2
          periodSeconds: 2
          failureThreshold: 60       # first start downloads the package from npm
---
apiVersion: v1
kind: Service
metadata:
  name: everything
  namespace: mcp
  labels: { app: everything }
spec:
  selector: { app: everything }
  ports:
  - port: 3001
    targetPort: 3001
    appProtocol: agentgateway.dev/mcp
