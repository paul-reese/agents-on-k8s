# Module 5: Jaeger, a trace viewer. Receives OpenTelemetry (OTLP) on 4317/4318, UI on 16686.
# In-memory storage: traces disappear when the pod restarts. Fine for learning.
apiVersion: v1
kind: Namespace
metadata:
  name: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
      - name: jaeger
        image: jaegertracing/jaeger:2.23.0
        env:
        - name: JAEGER_LISTEN_HOST      # listen on all interfaces so other pods can send traces
          value: "0.0.0.0"
        ports:
        - { name: otlp-grpc, containerPort: 4317 }
        - { name: otlp-http, containerPort: 4318 }
        - { name: ui, containerPort: 16686 }
        resources:
          limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector: { app: jaeger }
  ports:
  - { name: otlp-grpc, port: 4317, targetPort: 4317 }
  - { name: otlp-http, port: 4318, targetPort: 4318 }
  - { name: ui, port: 16686, targetPort: 16686 }
