# Module 5: make agentgateway send a trace span for every LLM and MCP call to Jaeger.
# AgentgatewayParameters holds proxy settings; the Gateway points at it via infrastructure.parametersRef.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: tracing
  namespace: agentgateway-system
spec:
  rawConfig:
    config:
      tracing:
        otlpEndpoint: http://jaeger.observability.svc.cluster.local:4317
        otlpProtocol: grpc
        randomSampling: true          # trace every request (fine for a lab, not for production)
        fields:
          add:                        # GenAI attributes, filled from the LLM call (CEL)
            gen_ai.operation.name: '"chat"'
            gen_ai.system: "llm.provider"
            gen_ai.request.model: "llm.requestModel"
            gen_ai.response.model: "llm.responseModel"
            gen_ai.usage.completion_tokens: "llm.outputTokens"
            gen_ai.usage.prompt_tokens: "llm.inputTokens"
---
# Same Gateway as manifests/lab-b/gateway.yaml, plus the parametersRef.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: agentgateway-proxy
  namespace: agentgateway-system
spec:
  gatewayClassName: agentgateway
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: tracing
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
